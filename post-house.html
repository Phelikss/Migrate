<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>List your house | Migrate</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header"><div class="container">
    <a class="logo" href="index.html">Migrate</a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
  </div></header>

  <main class="container"><div class="auth-card" style="max-width:680px">
    <h2>List your house</h2>
    <p class="meta" style="margin-bottom:1.5rem">Students will see this listing as soon as you post it.</p>
    <p id="gate" class="msg bad"></p>
    <form id="post-form">
      <div class="form-group"><label for="p-title">Title</label><input id="p-title" placeholder="Bright bedsitter near the main gate" required></div>
      <div class="row2">
        <div class="form-group"><label for="p-rent">Rent (KES / month)</label><input type="number" id="p-rent" min="0" step="500" required></div>
        <div class="form-group"><label for="p-type">Type</label><select id="p-type" required></select></div>
      </div>
      <div class="row2">
        <div class="form-group"><label for="p-area">Area</label><input id="p-area" placeholder="e.g. Thogoto" required></div>
        <div class="form-group"><label for="p-location">Landmark or street</label><input id="p-location"></div>
      </div>
      <div class="row2">
        <div class="form-group"><label for="p-beds">Bedrooms</label><input type="number" id="p-beds" min="0"></div>
        <div class="form-group"><label for="p-baths">Bathrooms</label><input type="number" id="p-baths" min="0"></div>
      </div>
      <div class="form-group"><label for="p-amen">Amenities (comma separated)</label><input id="p-amen" placeholder="WiFi, Water, Security, Parking"></div>
      <div class="form-group"><label for="p-phone">Contact phone</label><input type="tel" id="p-phone" placeholder="0712345678" required></div>
      <div class="form-group"><label for="p-desc">Description</label><textarea id="p-desc" rows="4"></textarea></div>
      <div class="form-group"><label>Map pin (optional)</label>
        <div class="row2"><input id="p-lat" type="number" step="any" placeholder="Latitude"><input id="p-lng" type="number" step="any" placeholder="Longitude"></div>
        <button type="button" class="btn btn-outline" id="p-geo">Use my current location</button></div>
      <div class="form-group"><label for="p-photos">Photos</label><input type="file" id="p-photos" accept="image/*" multiple></div>
      <button type="submit" class="btn" style="width:100%">Post listing</button>
      <p id="post-msg" class="msg" aria-live="polite"></p>
    </form>
  </div></main>
  <footer class="site-footer"><div class="container">Migrate. Rentals for students of Presbyterian University, Thogoto.</div></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/post-house.js"></script>
</body>
</html>
